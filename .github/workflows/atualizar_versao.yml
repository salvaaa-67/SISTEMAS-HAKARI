name: Atualizar Versão Automática
on:
  push:
    branches:
      - main 

jobs:
  versionamento:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Gerar Tag de Versão
        id: gerador_tag 
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Atualizar versão no código Python
        run: |
          # 1. Captura a tag gerada pelo GitHub (ex: v2.19.4)
          TAG="${{ steps.gerador_tag.outputs.new_tag }}"
          
          # 2. Remove a letra "v" minúscula do início para isolar os números (fica: 2.19.4)
          VERSAO="${TAG#v}"
          
          # 3. Proteção: Se a versão estiver vazia por algum erro, o processo para aqui e não estraga o ficheiro
          if [ -z "$VERSAO" ]; then
            echo "Erro: A versão não foi capturada corretamente."
            exit 1
          fi

          # 4. Faz a substituição segura no ficheiro app.py
          sed -i "s/Hakari Bot V[0-9]*\.[0-9]*\.[0-9]*/Hakari Bot V${VERSAO}/g" app.py
          
          # 5. Prepara o novo commit e envia de volta para o GitHub
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          git add app.py
          git commit -m "bot: atualiza versão do status para V${VERSAO} [skip ci]"
          git push

      - name: Acionar Deploy no Render
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"