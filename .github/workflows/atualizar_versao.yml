name: Atualizar Versão Automática
on:
  push:
    branches:
      - main 

jobs:
  versionamento:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Gerar Tag de Versão
        id: gerador_tag 
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Atualizar versão no código Python
        run: |
          sed -i "s/Hakari Bot V[0-9]*\.[0-9]*\.[0-9]*/Hakari Bot V${{ steps.gerador_tag.outputs.new_version }}/g" app.py
          
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          git add app.py
          git commit -m "bot: atualiza versão do status para V${{ steps.gerador_tag.outputs.new_version }} [skip ci]"
          git push

      - name: Acionar Deploy no Render
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"